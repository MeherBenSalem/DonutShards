# Original donut-cosmic shop layout. Reloaded with /shardmanager reload.
schema-version: 1
title: "<gradient:#ff78b8:#8f7cff>Cosmic Confection Exchange</gradient>"
size: 54
categories:
  treats:
    slot: 22
    icon: {material: COOKIE, name: "<light_purple>Orbital Treats"}
    items:
      starlight-cookie:
        slot: 20
        price: 25
        material: COOKIE
        amount: 1
        name: "<gradient:#ffd166:#ff78b8>Starlight Cookie</gradient>"
        lore: ["<gray>A sweet souvenir from the sugar nebula.</gray>"]
        confirmation: true
        commands:
          - "say %player% bought a Starlight Cookie for %price% shards!"
      enchanted-blade:
        slot: 24
        price: 250
        material: DIAMOND_SWORD
        amount: 1
        name: "<light_purple>Starlight Blade</light_purple>"
        lore: ["<gray>Shop example with enchantments.</gray>"]
        enchantments:
          sharpness: 5
          unbreaking: 3
  daily-deals:
    slot: 31
    icon:
      material: CLOCK
      name: "<gold>Daily Deals</gold>"
      lore: ["<gray>Three offers below, new ones every day.</gray>"]
# Daily Deals: `count` offers from `pool`, the same for every player, rotating every `rotation-hours`.
# Each offer can be bought `limit-per-player` times per rotation (shards.bypass.limit skips the limit).
deals:
  enabled: true
  rotation-hours: 24
  count: 3
  slots: [38, 40, 42]
  limit-per-player: 1
  pool:
    golden-glaze:
      price: 40
      material: GOLDEN_APPLE
      amount: 2
      name: "<gold>Golden Glaze</gold>"
      lore: ["<gray>Two golden apples, half the usual price.</gray>"]
    comet-crate:
      price: 60
      material: EXPERIENCE_BOTTLE
      amount: 16
      name: "<aqua>Comet Crate</aqua>"
      lore: ["<gray>Sixteen bottles of stardust experience.</gray>"]
    nebula-rockets:
      price: 30
      material: FIREWORK_ROCKET
      amount: 32
      name: "<light_purple>Nebula Rockets</light_purple>"
    sprinkle-stack:
      price: 25
      material: COOKIE
      amount: 32
      name: "<gradient:#ffd166:#ff78b8>Sprinkle Stack</gradient>"
    meteor-ore:
      price: 120
      material: DIAMOND
      amount: 3
      name: "<aqua>Meteor Shards</aqua>"
      lore: ["<gray>Three diamonds, fresh from orbit.</gray>"]
