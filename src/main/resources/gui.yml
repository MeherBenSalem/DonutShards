# Inventory presentation. Slots are zero-based. previous/next/filler style the /shards top GUI (bottom row, 45-53).
schema-version: 1
filler: {material: GRAY_STAINED_GLASS_PANE, name: " "}
previous: {slot: 45, material: ARROW, name: "<yellow>Previous page"}
next: {slot: 53, material: ARROW, name: "<yellow>Next page"}
confirm: {slot: 11, material: LIME_CONCRETE, name: "<green>Confirm purchase"}
cancel: {slot: 15, material: RED_CONCRETE, name: "<red>Cancel"}
