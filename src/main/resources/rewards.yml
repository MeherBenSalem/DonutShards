# Multiple independently scheduled reward definitions.
schema-version: 1
rewards:
  sugar-orbit:
    enabled: true
    interval-seconds: 60
    min-shards: 1
    max-shards: 1
    worlds: []
    world-blacklist: []
    require-afk-zone: false
    permission: ""
    minimum-online-seconds: 0
    minimum-movement-blocks: 0.0
    game-modes: [SURVIVAL, ADVENTURE]
    minimum-tps: 16.0
    cooldown-seconds: 60
    message: "<gradient:#ffd166:#ff78b8>+<amount> Shard</gradient>"
    action-bar: true
    sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
    commands: []
