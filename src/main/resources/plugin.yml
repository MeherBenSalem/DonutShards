name: DonutShards
version: '${version}'
main: com.nightbeam.donutshards.DonutShardsPlugin
api-version: '1.20'
folia-supported: true
description: Shard economy with Sweet Spot AFK zones, boosters, Daily Deals and in-world leaderboards for Paper and Folia.
author: NightBeam Studio
website: https://github.com/MeherBenSalem/DonutShards
softdepend: [PlaceholderAPI, Vault]
commands:
  shards:
    aliases: [shard]
    permission: shards.use
  shardshop:
    permission: shards.shop
  afk:
    permission: shards.afk
  shardmanager:
    aliases: [donutshards, dshards]
    permission: shards.admin
permissions:
  shards.use: {default: true}
  shards.balance: {default: true}
  shards.balance.others: {default: op}
  shards.pay: {default: true}
  shards.convert: {default: true}
  shards.top: {default: true}
  shards.history: {default: true}
  shards.shop: {default: true}
  shards.afk: {default: true}
  shards.admin:
    default: op
    children:
      shards.admin.give: true
      shards.admin.take: true
      shards.admin.set: true
      shards.admin.reload: true
      shards.admin.zone: true
      shards.admin.booster: true
      shards.admin.board: true
      shards.admin.info: true
  shards.admin.give: {default: op}
  shards.admin.take: {default: op}
  shards.admin.set: {default: op}
  shards.admin.reload: {default: op}
  shards.admin.zone: {default: op}
  shards.admin.booster: {default: op}
  shards.admin.board: {default: op}
  shards.admin.info: {default: op}
  shards.bypass.cooldown: {default: op}
  shards.bypass.limit: {default: false}
