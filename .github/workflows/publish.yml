# Publishes the DonutShards release jar to CurseForge (NightBeam convention: CurseForge only since 24 Nov 2026).
# Run by the owner only:
#   * push a v*.*.* tag, or
#   * Actions > Publish > Run workflow (version without "v"; dry_run defaults to true).
#
# The jar must already be in releases/ (donutshards-{loader}-{minecraft}-{version}.jar, built and QA'd per
# CONTRIBUTING.md) with its line in releases/SHA256SUMS.txt; the workflow never rebuilds it. Before uploading it checks
# the checksum, that plugin.yml inside the jar carries the same version, and that the name's Minecraft range matches
# release/supported-minecraft.json.
#
# Secrets: CURSEFORGE_TOKEN (upload), CURSEFORGE_API_KEY (Core API, for the same-day guard). Variable: CURSEFORGE_ID.
# The existing Modrinth project stays up as it is but gets no new versions.
#
# Same-day guard (NightBeam convention): scripts/same_day_guard.mjs stops a real run if this plugin already had a
# release today (Africa/Tunis day), on CurseForge or in an earlier Publish run whose upload step ran ("Upload
# CurseForge", called "Upload" before 24 Nov 2026). It runs first and again right before the upload; a dry run only
# reports it, and a dry run never runs the "Upload CurseForge" step.

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without "v" (e.g. 2.0.0)
        required: true
      dry_run:
        description: Check everything but upload nothing
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Same-day guard
        env:
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLISH_WORKFLOW: publish.yml
          UPLOAD_STEP: Upload CurseForge|Upload
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: node scripts/same_day_guard.mjs

      - name: Resolve version
        id: ver
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/tags/v* ]]; then
            version="${REF_NAME#v}"; dry_run=false
          else
            version="$INPUT_VERSION"; dry_run="${INPUT_DRY_RUN:-true}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid version: $version" >&2; exit 1
          fi
          {
            echo "version=$version"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publish metadata tests
        run: node .github/scripts/detect-jar-meta.test.js

      - name: Find and verify the release jar
        id: jar
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(releases/donutshards-*-"$VERSION".jar)
          if [ ${#jars[@]} -ne 1 ]; then
            echo "Expected exactly one releases/donutshards-*-$VERSION.jar, found ${#jars[@]}" >&2; exit 1
          fi
          jar="${jars[0]}"
          node .github/scripts/detect-jar-meta.js "$jar"
          expected=$(awk -v f="$(basename "$jar")" '$2 == f { print $1 }' releases/SHA256SUMS.txt)
          actual=$(sha256sum "$jar" | cut -d' ' -f1)
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "Checksum mismatch for $jar (listed: ${expected:-none}, actual: $actual)" >&2; exit 1
          fi
          inside=$(unzip -p "$jar" plugin.yml | sed -n "s/^version: *'\{0,1\}\([^']*\)'\{0,1\}$/\1/p")
          if [ "$inside" != "$VERSION" ]; then
            echo "plugin.yml in $jar says $inside, expected $VERSION" >&2; exit 1
          fi
          notes="patchnotes/$VERSION.md"
          [ -f "$notes" ] || { echo "Missing $notes" >&2; exit 1; }
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          echo "Verified $jar ($actual)"

      - name: Show upload metadata (dry run, uploads nothing)
        if: ${{ steps.ver.outputs.dry_run == 'true' }}
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
          JAR: ${{ steps.jar.outputs.path }}
          DRY_RUN: ${{ steps.ver.outputs.dry_run }}
        run: node scripts/upload-release.cjs

      - name: Same-day guard (again, right before upload)
        env:
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLISH_WORKFLOW: publish.yml
          UPLOAD_STEP: Upload CurseForge|Upload
          DRY_RUN: ${{ steps.ver.outputs.dry_run }}
        run: node scripts/same_day_guard.mjs

      - name: Upload CurseForge
        if: ${{ steps.ver.outputs.dry_run != 'true' }}
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
          JAR: ${{ steps.jar.outputs.path }}
          DRY_RUN: ${{ steps.ver.outputs.dry_run }}
        run: node scripts/upload-release.cjs
