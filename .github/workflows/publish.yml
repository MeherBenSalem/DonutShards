# Publishes the DonutShards release jar to Modrinth and CurseForge. Run by the owner only:
#   * push a v*.*.* tag, or
#   * Actions > Publish > Run workflow (version without "v"; dry_run defaults to true).
#
# The jar must already be in releases/ (donutshards-{loader}-{minecraft}-{version}.jar, built and QA'd per
# CONTRIBUTING.md) with its line in releases/SHA256SUMS.txt; the workflow never rebuilds it. Before uploading it checks
# the checksum, that plugin.yml inside the jar carries the same version, and that the name's Minecraft range matches
# release/supported-minecraft.json.
#
# Secrets: MODRINTH_TOKEN, CURSEFORGE_TOKEN. Variables: MODRINTH_ID, CURSEFORGE_ID.

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without "v" (e.g. 2.0.0)
        required: true
      dry_run:
        description: Check everything but upload nothing
        type: boolean
        default: true
      platforms:
        description: Where to upload
        type: choice
        options: [both, modrinth, curseforge]
        default: both

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve version
        id: ver
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/tags/v* ]]; then
            version="${REF_NAME#v}"; dry_run=false; platforms=both
          else
            version="$INPUT_VERSION"; dry_run="${INPUT_DRY_RUN:-true}"; platforms="${INPUT_PLATFORMS:-both}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid version: $version" >&2; exit 1
          fi
          case "$platforms" in both|modrinth|curseforge) ;; *) echo "Invalid platforms: $platforms" >&2; exit 1 ;; esac
          {
            echo "version=$version"
            echo "dry_run=$dry_run"
            echo "platforms=$platforms"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publish metadata tests
        run: node .github/scripts/detect-jar-meta.test.js

      - name: Find and verify the release jar
        id: jar
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(releases/donutshards-*-"$VERSION".jar)
          if [ ${#jars[@]} -ne 1 ]; then
            echo "Expected exactly one releases/donutshards-*-$VERSION.jar, found ${#jars[@]}" >&2; exit 1
          fi
          jar="${jars[0]}"
          node .github/scripts/detect-jar-meta.js "$jar"
          expected=$(awk -v f="$(basename "$jar")" '$2 == f { print $1 }' releases/SHA256SUMS.txt)
          actual=$(sha256sum "$jar" | cut -d' ' -f1)
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "Checksum mismatch for $jar (listed: ${expected:-none}, actual: $actual)" >&2; exit 1
          fi
          inside=$(unzip -p "$jar" plugin.yml | sed -n "s/^version: *'\{0,1\}\([^']*\)'\{0,1\}$/\1/p")
          if [ "$inside" != "$VERSION" ]; then
            echo "plugin.yml in $jar says $inside, expected $VERSION" >&2; exit 1
          fi
          notes="patchnotes/$VERSION.md"
          [ -f "$notes" ] || { echo "Missing $notes" >&2; exit 1; }
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          echo "Verified $jar ($actual)"

      - name: Upload
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
          JAR: ${{ steps.jar.outputs.path }}
          DRY_RUN: ${{ steps.ver.outputs.dry_run }}
          PLATFORMS: ${{ steps.ver.outputs.platforms }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { detectRequired } = require('./.github/scripts/detect-jar-meta.js');
          const { VERSION: version, JAR: jar, DRY_RUN, PLATFORMS: platforms } = process.env;
          const dryRun = DRY_RUN === 'true';
          const meta = detectRequired(jar);
          if (meta.version !== version) throw new Error(`Jar version ${meta.version} != ${version}`);
          const changelog = fs.readFileSync(path.join('patchnotes', `${version}.md`), 'utf8');
          const prerelease = version.includes('-');
          const doModrinth = platforms !== 'curseforge';
          const doCurse = platforms !== 'modrinth';
          const name = path.basename(jar);

          const modrinth = {
            name: `DonutShards ${version}`,
            version_number: version,
            changelog,
            dependencies: [],
            game_versions: meta.gameVersions,
            version_type: prerelease ? 'beta' : 'release',
            loaders: meta.loaders,
            featured: true,
            status: 'listed',
            project_id: process.env.MODRINTH_ID,
            file_parts: ['file_0'],
            primary_file: 'file_0',
          };
          // CurseForge Bukkit-plugin projects take game version names.
          const curse = {
            changelog,
            changelogType: 'markdown',
            displayName: `DonutShards ${version}`,
            releaseType: prerelease ? 'beta' : 'release',
            // Same tags as the 1.5.x uploads that CurseForge accepted: every game version plus Client and Server.
            gameVersionNames: [...meta.gameVersions, 'Client', 'Server'],
          };
          console.log('Jar:', name);
          console.log('Modrinth:', JSON.stringify({ ...modrinth, changelog: `${changelog.length} chars` }));
          console.log('CurseForge:', JSON.stringify({ ...curse, changelog: `${changelog.length} chars` }));
          (async () => {
            if (dryRun) {
              console.log('Dry run: nothing uploaded.');
              return;
            }
            const bytes = fs.readFileSync(jar);
            if (doModrinth) {
              if (!process.env.MODRINTH_TOKEN || !process.env.MODRINTH_ID) throw new Error('MODRINTH_TOKEN / MODRINTH_ID missing');
              const form = new FormData();
              form.append('data', JSON.stringify(modrinth));
              form.append('file_0', new Blob([bytes]), name);
              const res = await fetch('https://api.modrinth.com/v2/version', {
                method: 'POST',
                headers: { Authorization: process.env.MODRINTH_TOKEN, 'User-Agent': 'NightBeam/DonutShards publish' },
                body: form,
              });
              const text = await res.text();
              if (!res.ok) throw new Error(`Modrinth ${res.status} ${text.slice(0, 500)}`);
              console.log('Modrinth OK', text.slice(0, 160));
            }
            if (doCurse) {
              if (!process.env.CURSEFORGE_TOKEN || !process.env.CURSEFORGE_ID) throw new Error('CURSEFORGE_TOKEN / CURSEFORGE_ID missing');
              const form = new FormData();
              form.append('metadata', JSON.stringify(curse));
              form.append('file', new Blob([bytes]), name);
              const res = await fetch(`https://minecraft.curseforge.com/api/projects/${encodeURIComponent(process.env.CURSEFORGE_ID)}/upload-file`, {
                method: 'POST',
                headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN },
                body: form,
              });
              const text = await res.text();
              if (!res.ok) throw new Error(`CurseForge ${res.status} ${text.slice(0, 500)}`);
              console.log('CurseForge OK', text.slice(0, 160));
            }
          })().catch((e) => { console.error(e.message); process.exit(1); });
          NODE
