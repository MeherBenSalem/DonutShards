name: CI

# NightBeam plugin CI: unit tests, the plugin.yml check (api-version '1.20', folia-supported, bStats ID, Java 17
# bytecode), the publisher script tests, and a smoke boot on Paper 1.20.1, Paper 26.3 and the newest Folia.
# The default branch is still master (main once it is renamed).
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, release jar and source checks
        run: |
          chmod +x gradlew
          ./gradlew release --no-daemon

      - name: Compile against every supported Paper API (1.21.1, 26.1.2, 26.2, 26.3)
        run: ./gradlew compileMatrix --no-daemon

      - name: Check plugin.yml and bytecode
        run: python3 scripts/check_plugin_yml.py --jar build/release/donutshards-*.jar

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publish metadata tests
        run: node .github/scripts/detect-jar-meta.test.js

      - name: Same-day guard tests
        run: node --test scripts/same_day_guard.test.mjs

      - name: Release jar names parse
        run: |
          set -euo pipefail
          shopt -s nullglob
          for jar in build/release/donutshards-*.jar releases/donutshards-*.jar; do
            echo -n "$jar -> "
            node .github/scripts/detect-jar-meta.js "$jar"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: donutshards-jar
          path: build/release/donutshards-*.jar
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: paper, version: "1.20.1" }
          - { project: paper, version: "26.3" }
          - { project: folia, version: latest }
    name: smoke (${{ matrix.project }} ${{ matrix.version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: actions/download-artifact@v4
        with:
          name: donutshards-jar
          path: artifact
      - name: Boot server
        run: >-
          python3 scripts/smoke_boot.py --project ${{ matrix.project }} --version ${{ matrix.version }}
          --jar 'artifact/donutshards-*.jar' --name DonutShards --package com.nightbeam.donutshards
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-${{ matrix.project }}-${{ matrix.version }}
          path: smoke-server/console.log
          if-no-files-found: ignore
